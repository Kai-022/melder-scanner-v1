<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Melder Scanner</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0b1220;color:#eef2ff}main{max-width:760px;margin:auto;padding:14px}.card{background:#151e2e;border:1px solid #2b374d;border-radius:16px;padding:14px;margin-bottom:12px}video{width:100%;background:#000;border-radius:12px;max-height:55vh}button,input{font:inherit;border-radius:10px;border:1px solid #42506a;padding:11px}button{background:#26344d;color:white;font-weight:650}.primary{background:#2563eb}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1;min-width:110px}.result{font-size:1.3rem;font-weight:750;text-align:center;padding:12px;background:#0e1727;border-radius:12px;margin-top:10px}.small{font-size:.82rem;color:#aab7cf}.item{display:flex;gap:10px;align-items:center;border-top:1px solid #2b374d;padding:10px 2px}.item span{flex:1}canvas{display:none}</style></head><body><main><h2>🔥 Melder Scanner</h2><div class="card"><div id="status" class="small">Kamera noch nicht gestartet.</div><video id="video" playsinline autoplay muted></video><canvas id="canvas"></canvas><div class="row"><button class="primary" id="start">Kamera starten</button><button id="scan">Scannen</button><button id="auto">Auto-Scan</button><button id="stop">Stop</button></div><div id="result" class="result">Gruppe – / Melder –</div><div id="ocr" class="small"></div></div><div class="card"><b>Manuell hinzufügen</b><div class="row"><input id="group" inputmode="numeric" placeholder="Gruppe"><input id="detector" inputmode="numeric" placeholder="Melder"><button id="add">Hinzufügen</button></div></div><div class="card"><b>Geprüfte Melder</b><div id="list"></div><div class="row"><button id="csv">CSV exportieren</button><button id="clear">Liste löschen</button></div></div><div class="card small">OCR-Ergebnisse vor sicherheitsrelevanter Verwendung am Originaldisplay kontrollieren.</div></main><script>
const $=x=>document.getElementById(x),v=$('video'),c=$('canvas'),st=$('status');let stream,timer,busy=false,last='',hits=0,items=JSON.parse(localStorage.getItem('melder-items')||'[]');
function render(){$('list').innerHTML=items.length?items.map((x,i)=>`<div class="item"><span><b>Gruppe ${x.g} / Melder ${x.m}</b><br><small>${new Date(x.t).toLocaleString('de-DE')}</small></span><button onclick="del(${i})">✕</button></div>`).join(''):'<p class="small">Noch keine Melder erfasst.</p>'}function save(){localStorage.setItem('melder-items',JSON.stringify(items));render()}window.del=i=>{items.splice(i,1);save()};
function add(g,m){g=(''+g).replace(/\D/g,'');m=(''+m).replace(/\D/g,'');if(!g||!m)return;if(!items.some(x=>x.g==g&&x.m==m)){items.unshift({g,m,t:Date.now()});save()}$('result').textContent=`Gruppe ${g} / Melder ${m}`;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(`Gruppe ${g}, Melder ${m}`);u.lang='de-DE';speechSynthesis.speak(u)}
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;st.textContent='Kamera aktiv.'}catch(e){st.textContent='Kamerafehler: '+e.message}};
function parse(t){let s=t.replace(/\s+/g,' '),g=s.match(/(?:GRUPPE|GRUP|GR)\D{0,12}(\d{1,4})/i),m=s.match(/(?:MELDER|MELD|ME)\D{0,12}(\d{1,4})/i);if(g&&m)return[g[1],m[1]];let n=[...s.matchAll(/\b\d{1,4}\b/g)].map(x=>x[0]);return n.length>=2?[n[0],n[1]]:null}
async function scan(){if(busy||!stream||v.readyState<2)return;busy=true;st.textContent='Erkennung läuft …';try{let w=v.videoWidth,h=v.videoHeight,sy=Math.floor(h*.42),sh=h-sy;c.width=w;c.height=sh;c.getContext('2d').drawImage(v,0,sy,w,sh,0,0,w,sh);let r=await Tesseract.recognize(c,'deu'),t=r.data.text||'';$('ocr').textContent='OCR: '+t.replace(/\s+/g,' ').slice(0,160);let p=parse(t);if(p){let k=p.join('/');hits=k===last?hits+1:1;last=k;$('result').textContent=`Gruppe ${p[0]} / Melder ${p[1]} ${hits<2?'(prüfe…)':''}`;if(hits>=2){add(...p);hits=0;last=''}st.textContent='Erkennung erfolgreich.'}else st.textContent='Keine eindeutige Gruppe/Melder erkannt.'}catch(e){st.textContent='OCR-Fehler: '+e.message}finally{busy=false}}
$('scan').onclick=scan;$('auto').onclick=()=>{if(!timer)timer=setInterval(scan,2500)};$('stop').onclick=()=>{clearInterval(timer);timer=null;if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}st.textContent='Gestoppt.'};$('add').onclick=()=>add($('group').value,$('detector').value);$('clear').onclick=()=>{if(confirm('Liste wirklich löschen?')){items=[];save()}};$('csv').onclick=()=>{let s='Gruppe;Melder;Zeit\n'+items.map(x=>`${x.g};${x.m};${new Date(x.t).toLocaleString('de-DE')}`).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='melder.csv';a.click()};render();
</script></body></html>
