<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Melder Scanner</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0b1220;color:#eef2ff}main{max-width:760px;margin:auto;padding:14px}.card{background:#151e2e;border:1px solid #2b374d;border-radius:16px;padding:14px;margin-bottom:12px}video{width:100%;background:#000;border-radius:12px;max-height:55vh}.camera{position:relative;overflow:hidden;border-radius:12px;--x:15%;--y:68%;--w:70%;--h:10%}.scanbox{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);border:3px solid #ef4444;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.30);touch-action:none}.scanbox:after{content:"↘";position:absolute;right:-14px;bottom:-14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ef4444;color:white;font-weight:900;font-size:18px}.scanlabel{position:absolute;left:10px;top:10px;background:rgba(239,68,68,.92);color:white;padding:4px 8px;border-radius:7px;font-size:.72rem;font-weight:700;pointer-events:none;z-index:2}.rangegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.rangegrid label{font-size:.78rem;color:#aab7cf}.rangegrid input{width:100%;padding:0}button,input{font:inherit;border-radius:10px;border:1px solid #42506a;padding:11px}button{background:#26344d;color:white;font-weight:650}.primary{background:#2563eb}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1;min-width:110px}.result{font-size:1.3rem;font-weight:750;text-align:center;padding:12px;background:#0e1727;border-radius:12px;margin-top:10px}.small{font-size:.82rem;color:#aab7cf}.item{display:flex;gap:10px;align-items:center;border-top:1px solid #2b374d;padding:10px 2px}.item span{flex:1}canvas{display:none}</style></head><body><main><h2>🔥 Melder Scanner</h2><div class="card"><div id="status" class="small">Kamera noch nicht gestartet.</div><div class="camera" id="camera"><video id="video" playsinline autoplay muted></video><div class="scanlabel">Scanbereich – roten Rahmen verschieben</div><div class="scanbox" id="scanbox"></div></div><canvas id="canvas"></canvas>
<div class="rangegrid">
<label>Breite <input id="rw" type="range" min="20" max="95" value="70"></label>
<label>Höhe <input id="rh" type="range" min="6" max="45" value="10"></label>
</div>
<div class="row"><button id="resetbox">Scanbereich zurücksetzen</button></div><div class="row"><button class="primary" id="start">Kamera starten</button><button id="scan">Scannen</button><button id="auto">Auto-Scan</button><button id="stop">Stop</button></div><div id="result" class="result">Gruppe – / Melder –</div><div id="ocr" class="small"></div></div><div class="card"><b>Manuell hinzufügen</b><div class="row"><input id="group" inputmode="numeric" placeholder="Gruppe"><input id="detector" inputmode="numeric" placeholder="Melder"><button id="add">Hinzufügen</button></div></div><div class="card"><b>Geprüfte Melder</b><div id="list"></div><div class="row"><button id="csv">CSV exportieren</button><button id="clear">Liste löschen</button></div></div><div class="card small">OCR-Ergebnisse vor sicherheitsrelevanter Verwendung am Originaldisplay kontrollieren.</div></main><script>
const $=x=>document.getElementById(x),v=$('video'),c=$('canvas'),st=$('status');let stream,timer,busy=false,last='',hits=0,items=JSON.parse(localStorage.getItem('melder-items')||'[]');
function render(){$('list').innerHTML=items.length?items.map((x,i)=>`<div class="item"><span><b>Gruppe ${x.g} / Melder ${x.m}</b><br><small>${new Date(x.t).toLocaleString('de-DE')}</small></span><button onclick="del(${i})">✕</button></div>`).join(''):'<p class="small">Noch keine Melder erfasst.</p>'}function save(){localStorage.setItem('melder-items',JSON.stringify(items));render()}window.del=i=>{items.splice(i,1);save()};
function add(g,m){g=(''+g).replace(/\D/g,'');m=(''+m).replace(/\D/g,'');if(!g||!m)return;if(!items.some(x=>x.g==g&&x.m==m)){items.unshift({g,m,t:Date.now()});save()}$('result').textContent=`Gruppe ${g} / Melder ${m}`;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(`Gruppe ${g}, Melder ${m}`);u.lang='de-DE';speechSynthesis.speak(u)}
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;st.textContent='Kamera aktiv.'}catch(e){st.textContent='Kamerafehler: '+e.message}};
function parse(t){let s=t.replace(/\s+/g,' ');let g=s.match(/GRUPPE\s*[:;.=-]?\s*(\d{1,4})/i),m=s.match(/MELDER\s*[:;.=-]?\s*(\d{1,4})/i);return(g&&m)?[g[1],m[1]]:null}
async function scan(){if(busy||!stream||v.readyState<2)return;busy=true;st.textContent='Erkennung läuft …';try{let vw=v.videoWidth,vh=v.videoHeight,b=boxState(),sx=Math.floor(vw*b.x/100),sy=Math.floor(vh*b.y/100),sw=Math.floor(vw*b.w/100),sh=Math.floor(vh*b.h/100);c.width=sw;c.height=sh;let ctx=c.getContext('2d');ctx.drawImage(v,sx,sy,sw,sh,0,0,sw,sh);let img=ctx.getImageData(0,0,sw,sh),d=img.data;for(let i=0;i<d.length;i+=4){let y=.299*d[i]+.587*d[i+1]+.114*d[i+2];let z=y>145?255:0;d[i]=d[i+1]=d[i+2]=z}ctx.putImageData(img,0,0);let r=await Tesseract.recognize(c,'deu'),t=r.data.text||'';$('ocr').textContent='OCR: '+t.replace(/\s+/g,' ').slice(0,160);let p=parse(t);if(p){let k=p.join('/');hits=k===last?hits+1:1;last=k;$('result').textContent=`Gruppe ${p[0]} / Melder ${p[1]} ${hits<2?'(prüfe…)':''}`;if(hits>=2){add(...p);hits=0;last=''}st.textContent='Erkennung erfolgreich.'}else st.textContent='Keine eindeutige Gruppe/Melder erkannt.'}catch(e){st.textContent='OCR-Fehler: '+e.message}finally{busy=false}}
$('scan').onclick=scan;$('auto').onclick=()=>{if(!timer)timer=setInterval(scan,2500)};$('stop').onclick=()=>{clearInterval(timer);timer=null;if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}st.textContent='Gestoppt.'};$('add').onclick=()=>add($('group').value,$('detector').value);$('clear').onclick=()=>{if(confirm('Liste wirklich löschen?')){items=[];save()}};$('csv').onclick=()=>{let s='Gruppe;Melder;Zeit\n'+items.map(x=>`${x.g};${x.m};${new Date(x.t).toLocaleString('de-DE')}`).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='melder.csv';a.click()};
const cam=$('camera'),box=$('scanbox'),rw=$('rw'),rh=$('rh');
let bs=JSON.parse(localStorage.getItem('scan-box')||'{"x":15,"y":68,"w":70,"h":10}');
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function boxState(){return bs}
function applyBox(){
 bs.w=clamp(+rw.value,20,95);bs.h=clamp(+rh.value,6,45);
 bs.x=clamp(bs.x,0,100-bs.w);bs.y=clamp(bs.y,0,100-bs.h);
 cam.style.setProperty('--x',bs.x+'%');cam.style.setProperty('--y',bs.y+'%');
 cam.style.setProperty('--w',bs.w+'%');cam.style.setProperty('--h',bs.h+'%');
 localStorage.setItem('scan-box',JSON.stringify(bs))
}
rw.value=bs.w;rh.value=bs.h;applyBox();
rw.oninput=()=>{bs.w=+rw.value;applyBox()};rh.oninput=()=>{bs.h=+rh.value;applyBox()};
$('resetbox').onclick=()=>{bs={x:15,y:68,w:70,h:10};rw.value=70;rh.value=10;applyBox()};
let drag=null;
box.addEventListener('pointerdown',e=>{e.preventDefault();box.setPointerCapture(e.pointerId);let r=cam.getBoundingClientRect();drag={px:e.clientX,py:e.clientY,x:bs.x,y:bs.y,cw:r.width,ch:r.height}});
box.addEventListener('pointermove',e=>{if(!drag)return;bs.x=drag.x+(e.clientX-drag.px)/drag.cw*100;bs.y=drag.y+(e.clientY-drag.py)/drag.ch*100;applyBox()});
box.addEventListener('pointerup',()=>drag=null);box.addEventListener('pointercancel',()=>drag=null);
render();
</script></body></html>
